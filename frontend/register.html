<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | Messenger</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">Messenger</span>
      <h1>Create your account</h1>
      <p class="subtitle">Pick a username and secure your space.</p>

      <form id="register-form" novalidate>
        <div>
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" name="email" autocomplete="email" required />
        </div>
        <div>
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" name="username" autocomplete="username" required />
        </div>
        <div>
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" name="password" autocomplete="new-password" required />
        </div>
        <div>
          <label for="reg-confirm">Confirm password</label>
          <input id="reg-confirm" type="password" autocomplete="new-password" required />
        </div>
        <p id="register-error" class="error-message hidden"></p>
        <div class="form-actions">
          <button type="submit" class="primary-btn">Create account</button>
          <a class="secondary-btn" href="/login">Sign in</a>
        </div>
      </form>

      <p class="muted-action"><a href="/">Back to home</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('register-error');
    const submitBtn = form.querySelector('button');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const email = document.getElementById('reg-email').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (!email || !username || !password || !confirm) {
        showError('Please fill every field.');
        return;
      }
      if (!/^([^\s@]+)@([^\s@]+)\.([^\s@]+)$/.test(email)) {
        showError('Enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) {
          showError(data.error || 'Unable to create account.');
        } else {
          alert('Account created! You can sign in now.');
          window.location.href = '/login';
        }
      } catch (err) {
        showError('Cannot reach the server right now.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>

</html>
