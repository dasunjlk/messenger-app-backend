<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Messenger</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">Messenger</span>
      <h1>Create account</h1>
      <p class="subtitle">Choose a username and secure your messages.</p>

      <form id="register-form">
        <div>
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="name@email.com" autocomplete="email" required />
        </div>

        <div>
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" placeholder="how your friends see you" autocomplete="username" required />
        </div>

        <div>
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />
        </div>

        <div>
          <label for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" autocomplete="new-password" required />
        </div>

        <p id="register-error" class="error-message hidden"></p>

        <button type="submit" class="primary-btn">Create account</button>
      </form>

      <p class="muted-action">Already have an account? <a href="/login">Sign in</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const errEl = document.getElementById('register-error');
    const submitBtn = form.querySelector('button');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');

      const email = document.getElementById('reg-email').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (!email) { showError('Please enter your email.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email.'); return; }
      if (!username) { showError('Please choose a username.'); return; }
      if (!password) { showError('Please enter a password.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password })
        });
        const json = await res.json().catch(() => ({}));

        if (res.ok) {
          alert('Account created! You can sign in now.');
          window.location.href = '/login';
        } else {
          showError(json.error || 'Registration failed.');
        }
      } catch (err) {
        showError('Unable to connect. Please try again later.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>

</html>
