<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop>
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>
  <main class="auth-container">
    <section class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Sign up to get started</p>

      <form id="register-form">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="Enter your email" required />

        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" placeholder="Choose a username" required />

        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="Create a password" required />

        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Confirm your password" required />

        <p id="register-error" class="error-message hidden"></p>

        <button type="submit" class="primary-btn">Create Account</button>

        <p class="forgot-password">
          <a href="/login">Already have an account? Sign in</a>
        </p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('register-form');
    const errEl = document.getElementById('register-error');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (!email) { showError('Please enter your email.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email.'); return; }
      if (!username) { showError('Please choose a username.'); return; }
      if (!password) { showError('Please enter a password.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      errEl.classList.add('hidden');
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password })
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok) {
          alert('Account created successfully! Redirecting to login.');
          window.location.href = '/login';
        } else {
          showError(json.error || 'Registration failed.');
        }
      } catch (err) {
        showError('Unable to connect. Please try again later.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
