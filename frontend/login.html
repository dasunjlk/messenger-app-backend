<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Messenger</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">Messenger</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to pick up conversations without missing a beat.</p>

      <form id="login-form">
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" required />
        </div>

        <div>
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>

        <p id="login-error" class="error-message hidden"></p>

        <button type="submit" class="primary-btn">Sign In</button>
      </form>

      <p class="muted-action">Need an account? <a href="/register">Create one</a></p>
      <p class="muted-action"><a href="/">Back to home</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('login-error');
    const btn = form.querySelector('button');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(data.error || 'Unable to sign in. Check your details and try again.');
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username || '');
          localStorage.setItem('email', data.email || email);
          window.location.href = '/';
        }
      } catch (err) {
        showError('Cannot reach the server right now. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>

</html>
