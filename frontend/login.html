<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop>
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>
  <main class="auth-container">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="login-form" method="post" action="/login">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="Enter your email" required />

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Enter your password" required />

        <p id="login-error" class="error-message hidden"></p>

        <button type="submit" class="primary-btn">Sign In</button>

        <p class="forgot-password">
          <a href="/register">Don't have an account? Create one</a>
        </p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('login-error');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email) { showError('Please enter your email.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email.'); return; }
      if (!password) { showError('Please enter your password.'); return; }

      errEl.classList.add('hidden');
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok) {
          window.location.href = json.redirect || '/dashboard';
        } else {
          showError(json.error || 'Login failed. Check your credentials.');
        }
      } catch (err) {
        showError('Unable to connect. Please try again later.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
