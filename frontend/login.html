<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Messenger</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">Messenger</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to keep conversations in sync.</p>

      <form id="login-form" novalidate>
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" autocomplete="email" required />
        </div>
        <div>
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="error-message hidden"></p>
        <div class="form-actions">
          <button type="submit" class="primary-btn">Sign in</button>
          <a class="secondary-btn" href="/register">Create account</a>
        </div>
      </form>

      <p class="muted-action"><a href="/">Back to home</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = form.querySelector('button');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Email and password are required.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) {
          showError(data.error || 'Unable to sign in.');
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username || '');
          localStorage.setItem('email', data.email || email);
          window.location.href = '/';
        }
      } catch (err) {
        showError('Cannot reach the server right now.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>

</html>
