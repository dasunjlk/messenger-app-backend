<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger | Home</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="/asserts/14478075_1920_1080_30fps.mp4" type="video/mp4">
  </video>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">Messenger</span>
      <h1>Stay connected without the noise.</h1>
      <p class="subtitle" id="status-text">Checking your session...</p>

      <div class="hero-actions" id="hero-actions">
        <a class="primary-btn" href="/login">Sign in</a>
        <a class="secondary-btn" href="/register">Create account</a>
      </div>

      <div id="profile-card" class="hidden">
        <div class="profile-meta">
          <span class="pill" id="pill-username"></span>
          <span class="pill" id="pill-email"></span>
        </div>
        <pre id="profile-json"></pre>
        <div class="form-actions">
          <button class="secondary-btn" type="button" id="logout-btn">Logout</button>
        </div>
      </div>

      <p class="footer-note">Server endpoints: /register, /login, /profile, /ping</p>
    </section>
  </main>

  <script>
    const statusText = document.getElementById('status-text');
    const heroActions = document.getElementById('hero-actions');
    const profileCard = document.getElementById('profile-card');
    const profileJson = document.getElementById('profile-json');
    const pillUsername = document.getElementById('pill-username');
    const pillEmail = document.getElementById('pill-email');
    const logoutBtn = document.getElementById('logout-btn');

    function showSignedOut(message) {
      statusText.textContent = message;
      heroActions.classList.remove('hidden');
      profileCard.classList.add('hidden');
    }

    function showProfile(data) {
      statusText.textContent = `Welcome back, ${data.username || 'friend'}!`;
      heroActions.classList.add('hidden');
      profileCard.classList.remove('hidden');
      pillUsername.textContent = `Username: ${data.username || '-'}`;
      pillEmail.textContent = `Email: ${data.email || '-'}`;
      profileJson.textContent = JSON.stringify(data, null, 2);
    }

    async function hydrate() {
      const token = localStorage.getItem('token');
      if (!token) {
        showSignedOut('Sign in to view your profile.');
        return;
      }

      statusText.textContent = 'Fetching your profile...';
      try {
        const res = await fetch('/profile', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) {
          localStorage.removeItem('token');
          showSignedOut('Session expired. Please sign in again.');
          return;
        }
        showProfile(data);
      } catch (err) {
        statusText.textContent = 'Unable to reach the server right now.';
      }
    }

    logoutBtn?.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      localStorage.removeItem('email');
      showSignedOut('You are signed out.');
    });

    hydrate();
  </script>
</body>

</html>
